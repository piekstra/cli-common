[package]
name = "pk-cli-mcp-wasm-demo"
description = "A toolset exported with pk_cli_mcp::export_wasm!, for testing the WebAssembly ABI against its reference JavaScript host. Not published."
publish = false
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Built as a cdylib for wasm32 by `make wasm-host-check`:
#   cargo rustc -p pk-cli-mcp-wasm-demo --lib --crate-type cdylib --release \
#     --target wasm32-unknown-unknown
# the same command a CLI's release uses for its own module.

[dependencies]
pk-cli-core = { workspace = true }
pk-cli-mcp = { workspace = true, features = ["wasm"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
pk-cli-mcp = { workspace = true, features = ["wasm", "test-util"] }
