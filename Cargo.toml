[workspace]
resolver = "2"
members = [
    "crates/pk-cli-core",
    "crates/pk-cli-secrets",
    "crates/pk-cli-config",
    "crates/pk-cli-selfupdate",
    "crates/pk-cli-auth",
    "crates/pk-cli-http",
    "crates/pk-cli-utility",
    "crates/pk-cli-scrape",
    "crates/example-cli",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/cli-common"
homepage = "https://github.com/piekstra/cli-common"
authors = ["piekstra"]

[workspace.dependencies]
pk-cli-core = { path = "crates/pk-cli-core", version = "0.2.1" }
pk-cli-secrets = { path = "crates/pk-cli-secrets", version = "0.2.1" }
pk-cli-config = { path = "crates/pk-cli-config", version = "0.2.1" }
pk-cli-selfupdate = { path = "crates/pk-cli-selfupdate", version = "0.2.1" }
pk-cli-auth = { path = "crates/pk-cli-auth", version = "0.2.1" }
pk-cli-http = { path = "crates/pk-cli-http", version = "0.2.1" }
pk-cli-utility = { path = "crates/pk-cli-utility", version = "0.2.1" }
pk-cli-scrape = { path = "crates/pk-cli-scrape", version = "0.2.1" }

clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
# preserve_order makes object key order insertion order rather than
# alphabetical. `output::table_view` exists to choose and order table columns,
# and `output::kv` renders DTO fields in the order the code builds them — both
# contracts are only real with this on. Cargo features are additive, so setting
# it here gives every consumer the same documented behaviour instead of leaving
# it to whether each CLI happens to enable the flag itself.
serde_json = { version = "1", features = ["preserve_order"] }
rpassword = "7"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
self-replace = "1"
keyring = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
