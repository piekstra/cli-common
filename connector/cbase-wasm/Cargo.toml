[package]
name = "cbase-wasm"
version = "0.0.0"
edition = "2021"
publish = false
description = "coinbase-cli's MCP tools compiled to WebAssembly for the Cloudflare Worker connector (spike)."
license = "MIT OR Apache-2.0"

# Its own workspace: this crate is not a member of cli-common's.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# The patched coinbase-cli library (scripts/build-wasm.sh materializes it):
# the signer, client, parsers and MCP tool table, without the native feature.
cbase = { package = "coinbase-cli", path = "../.cache/coinbase-cli", default-features = false }
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.4.0" }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# reqwest's wasm32 backend is a thin layer over the global `fetch`, which is
# what workerd provides. No TLS or runtime features apply on this target.
reqwest = { version = "0.12", default-features = false }
# WebCrypto, for ES256 in native code instead of pure-Rust p256 (see lib.rs).
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "CryptoKey", "EcKeyImportParams", "EcdsaParams"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# No `strip`: wasm-bindgen reads the target_features section, then drops it.
