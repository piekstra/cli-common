[workspace]
resolver = "2"
members = [
    "crates/pk-cli-core",
    "crates/pk-cli-secrets",
    "crates/pk-cli-config",
    "crates/pk-cli-selfupdate",
    "crates/pk-cli-auth",
    "crates/pk-cli-http",
    "crates/pk-cli-utility",
    "crates/pk-cli-documents",
    "crates/pk-cli-scrape",
    "crates/pk-cli-drive",
    "crates/pk-cli-browser",
    "crates/pk-cli-mcp",
    "crates/pk-cli-mcp-wasm-demo",
    "crates/example-cli",
]

[workspace.package]
version = "0.15.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/cli-common"
homepage = "https://github.com/piekstra/cli-common"
authors = ["piekstra"]

[workspace.dependencies]
pk-cli-core = { path = "crates/pk-cli-core", version = "0.15.0" }
pk-cli-secrets = { path = "crates/pk-cli-secrets", version = "0.15.0" }
pk-cli-config = { path = "crates/pk-cli-config", version = "0.15.0" }
pk-cli-selfupdate = { path = "crates/pk-cli-selfupdate", version = "0.15.0" }
pk-cli-auth = { path = "crates/pk-cli-auth", version = "0.15.0" }
pk-cli-http = { path = "crates/pk-cli-http", version = "0.15.0" }
pk-cli-utility = { path = "crates/pk-cli-utility", version = "0.15.0" }
pk-cli-documents = { path = "crates/pk-cli-documents", version = "0.15.0" }
pk-cli-scrape = { path = "crates/pk-cli-scrape", version = "0.15.0" }
pk-cli-drive = { path = "crates/pk-cli-drive", version = "0.15.0" }
pk-cli-browser = { path = "crates/pk-cli-browser", version = "0.15.0" }
pk-cli-mcp = { path = "crates/pk-cli-mcp", version = "0.15.0" }

clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
# preserve_order makes object key order insertion order rather than
# alphabetical. `output::table_view` exists to choose and order table columns,
# and `output::kv` renders DTO fields in the order the code builds them — both
# contracts are only real with this on. Cargo features are additive, so setting
# it here gives every consumer the same documented behaviour instead of leaving
# it to whether each CLI happens to enable the flag itself.
serde_json = { version = "1", features = ["preserve_order"] }
rpassword = "7"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
self-replace = "1"
keyring = "3"
libc = "0.2"
# pk-cli-browser: the blocking CDP websocket (no TLS: Chrome's debug port is
# plain ws:// on loopback) and the Ctrl-C hook that tears the window down.
# The same pins sofi-cli, wealthfront-cli and carta-cli carry.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ctrlc = "3.5"
# pk-cli-mcp: tool input/output JSON Schemas (the same major rmcp uses, so a
# CLI's derives serve both), and behind its `stdio` feature the official MCP
# Rust SDK plus the runtime its stdio transport needs.
schemars = "1"
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
# pk-cli-mcp's `http` feature: rmcp's stateless Streamable HTTP service on a
# hyper HTTP/1.1 listener bound to 127.0.0.1, and the OS CSPRNG for a new
# bearer token. The same majors rmcp and reqwest already bring.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
getrandom = "0.4"

[profile.release]
strip = true
lto = true
opt-level = "z"
