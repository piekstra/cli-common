name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # fmt + clippy + tests on Linux. Tests are keychain-free by design (see
  # AGENTS.md), so nothing here needs a Mac.
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # pk-cli-mcp's core must build for WebAssembly (make wasm-check).
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # wasm-host-check runs the ABI's reference host, TypeScript that Node
      # 22.18+ runs without a build step.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Linux keyring build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev
      # The Makefile is the one definition of the gate; `make verify` runs
      # these eight locally.
      - run: make fmt-check
      - run: make lint
      - run: make test
      - run: make test-util-check
      - run: make mcp-check
      - run: make wasm-check
      - run: make wasm-host-check
      - run: make scripts-check

  # The deploy-your-own connector: `make connector-check` fetches and
  # verifies the pinned modules as a deploy does, then runs the OAuth and MCP
  # flow under `wrangler dev --local` against the localhost mocks, with
  # example-cli's `mcp --http` as a home module. No Cloudflare account, no
  # tunnel, nothing deployed.
  connector:
    name: connector (typecheck, tests, local e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux keyring build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: connector/package-lock.json
      - run: make connector-check

  # The platform-specific slivers are the apple-native keyring backend in
  # pk-cli-secrets and the codesign re-sign step in pk-cli-selfupdate
  # (`#[cfg(target_os = "macos")]`), so macOS builds the workspace and runs
  # those two crates' tests — not a second copy of the whole gate (macOS
  # minutes bill at ~10x). Add a crate here when it grows a macOS-only path.
  # The self-view Swift helpers are the scripts' macOS sliver: the Linux
  # tests stub them, so this job type-checks each one and holds the window
  # lister to the line format the stub imitates.
  macos-smoke:
    name: macos smoke (apple-native keyring, codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test -p pk-cli-secrets -p pk-cli-selfupdate
      # shell: bash adds pipefail, so the lister's own failure fails the step.
      - name: self-view Swift helpers
        shell: bash
        run: |
          for f in scripts/lib/*.swift; do swiftc -typecheck "$f"; done
          swift scripts/lib/self-view-windows.swift | awk '
            $0 !~ /^-?[0-9]+( -?[0-9]+){6}$/ { bad = 1; print "bad window line: " $0 }
            END { print NR " window lines"; if (NR == 0) exit 1; exit bad }'

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      checks: write # rustsec/audit-check publishes a check run; without this it dies with "Resource not accessible by integration"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
