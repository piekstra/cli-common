[package]
name = "pk-cli-drive"
description = "State in the owner's Drive for the piekstra CLI family: a mounted-folder and an rclone backend behind one interface, with a stale-while-revalidate read cache that never becomes a second source of truth."
version.workspace = true
edition.workspace = true
# `File::lock` (the cache's write/fetch ordering lock) is stable from 1.89.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
pk-cli-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
