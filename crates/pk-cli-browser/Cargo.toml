[package]
name = "pk-cli-browser"
description = "Browser sign-in for the piekstra CLI family: a scratch-profile Chrome the owner signs in through, and the web session read back over the DevTools protocol (localStorage or cookies) without ever touching disk or argv."
version.workspace = true
edition.workspace = true
# tungstenite 0.30 (through its sha1/digest stack) needs 1.85.
rust-version = "1.85"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
pk-cli-core = { workspace = true }
pk-cli-secrets = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tungstenite = { workspace = true }
ctrlc = { workspace = true }

[features]
# Constructors for what a capture hands over (`Captured::for_test` and its
# builder, `JarCookie::for_test`, `CapturedRequest::for_test`,
# `LoggedRequest::for_test`), so a CLI's unit tests can run its confirm hook
# and its mappings on known values. For a CLI's `[dev-dependencies]` only:
# off, nothing of it is compiled, and the crate's API and behaviour are
# unchanged.
test-util = []

# The second Ctrl-C force-kills a live Chrome by pid from the handler thread.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
