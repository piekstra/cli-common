[package]
name = "pk-cli-mcp"
description = "MCP tools for the piekstra CLI family: a WASM-ready core (tool definitions, results, output shaping, error mapping) and a stdio server for `<bin> mcp`."
version.workspace = true
edition.workspace = true
# rmcp 3.8 (the `stdio` feature) needs 1.88. The core alone builds on the
# workspace floor, but one crate carries one floor.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
# The core: everything here builds for wasm32-unknown-unknown, so the same
# toolset runs in a Cloudflare Worker. No tokio, no keyring, no processes,
# no blocking I/O. `make wasm-check` (and CI) holds it to that.
pk-cli-core = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# `stdio`: the native `<bin> mcp` server.
clap = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
# The rmcp stdio server and the clap `mcp` subcommand. Native only.
stdio = ["dep:clap", "dep:rmcp", "dep:tokio"]
# The conformance checks and call helpers a CLI's tests use. Declare it under
# `[dev-dependencies]` only, so the shipped binary never carries it.
test-util = []
