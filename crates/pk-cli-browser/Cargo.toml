[package]
name = "pk-cli-browser"
description = "Browser sign-in for the piekstra CLI family: a Chrome the owner signs in through, in an owner-only profile each CLI keeps so the provider remembers the device, and the web session read back over the DevTools protocol (localStorage or cookies) without the CLI ever writing it to disk or argv."
version.workspace = true
edition.workspace = true
# tungstenite 0.30 (through its sha1/digest stack) needs 1.85.
rust-version = "1.85"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
pk-cli-core = { workspace = true }
pk-cli-secrets = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tungstenite = { workspace = true }
ctrlc = { workspace = true }

[features]
# Constructors for what a capture hands over (`Captured::for_test` and its
# builder, `JarCookie::for_test`, `CapturedRequest::for_test`,
# `LoggedRequest::for_test`), so a CLI's unit tests can run its confirm hook
# and its mappings on known values; and the kept profile's root moved for a
# test (`Launch::profile_root`, `forget_profile_in`,
# `forget_named_profile_in`, `profile_exists_in`, `named_profile_exists_in`),
# so a logout or status test never reaches the real one. For a CLI's
# `[dev-dependencies]` only:
# off, nothing of it is compiled, and the crate's API and behaviour are
# unchanged.
test-util = []

# The second Ctrl-C force-kills a live Chrome by pid from the handler thread.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
