name: windows credential

# pk-cli-secrets on the real Windows Credential Manager. Nothing else here runs on Windows, and
# the split it does exists only there. A change to that crate pays for this runner, and so does
# one to the workspace's dependencies, since `keyring` holds the limit it guards.
on:
  pull_request:
    paths:
      - "crates/pk-cli-secrets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-credential.yml"
  push:
    branches: [main]
    paths:
      - "crates/pk-cli-secrets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-credential.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  credential-store:
    name: windows credential store
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p pk-cli-secrets --lib --test windows_store --locked -- -D warnings
      - run: cargo test -p pk-cli-secrets --test windows_store --locked
